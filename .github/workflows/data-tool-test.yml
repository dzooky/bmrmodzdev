name: Data Tool test build
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '12'
      - name: Validate installed service syntax with legacy Node 12
        run: |
          node --check tools/data-tool/service.js
          node --check tools/data-tool/cc-gear-worker.js
          node --check tools/data-tool/cc-gear-runner.js
          node --check tools/data-tool/uds-demand-scheduler.js
          node --check tools/data-tool/scheduler-live-test.js
          node --check tools/data-tool/scheduler-profile-test.js
          node --check tools/data-tool/scheduler-compare.js
          node --check tools/data-tool/data-broker.js
          node --check tools/data-tool/data-catalog.js
          node --check tools/data-tool/gear-state.js
          node --check tools/data-tool/broker-gateway.js
          node --check tools/data-tool/broker-self-test.js
          node --check tools/data-tool/auth-feasibility.js
          node --check tools/data-tool/auth-policy.js
          node --check tools/data-tool/native-peer-feasibility.js
          node --check tools/data-tool/native-peer-runner.js
          node --check tools/data-tool/package-boundary.js
          node --check tools/data-tool/native-process-boundary.js
          node --check tools/data-tool/process-boundary-payload.js
          node --check tools/data-tool/native-process-boundary.js
          node --check tools/data-tool/process-boundary-payload.js
          node --check tools/data-tool/secure-peer-probe.js
          node --check tools/data-tool/secure-ipc.js
          node tools/data-tool/health-startup.test.js
          node tools/data-tool/startup-legacy-node.test.js
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Validate JavaScript and JSON
        run: |
          node --check apps/data-diagnostics/main.js
          node --check apps/data-diagnostics/cache-probe.js
          node --check apps/data-diagnostics/cache-probe.test.js
          node --check apps/data-diagnostics/dpf-values.js
          node --check apps/data-diagnostics/vehicle-values.js
          node --check apps/data-diagnostics/upload.js
          node --check apps/data-diagnostics/network.js
          node --check apps/data-diagnostics/network.test.js
          node --check tools/data-tool/service.js
          node --check tools/data-tool/data-catalog.js
          node --check tools/data-tool/data-broker.js
          node --check tools/data-tool/broker-gateway.js
          node --check tools/data-tool/broker-self-test.js
          node --check tools/data-tool/secure-peer-probe.js
          node --check tools/data-tool/data-broker.test.js
          node --check tools/data-tool/auth-feasibility.test.js
          node --check tools/data-tool/native-peer-feasibility.js
          node --check tools/data-tool/native-peer-feasibility.test.js
          node --check tools/data-tool/native-peer-runner.test.js
          node --check tools/data-tool/secure-ipc.js
          node --check tools/data-tool/identity-survey.js
          node --check apps/data-diagnostics/identity-survey.js
          node --check tools/data-tool/uds-demand-scheduler.js
          node --check tools/data-tool/dpf-demand-profile.js
          node --check tools/data-tool/cds-engine.js
          node --check tools/data-tool/cds-stream-worker.js
          node --check tools/data-tool/signal-worker.js
          node --check tools/data-tool/signal-isolate.js
          node --check tools/data-tool/someip-setup.js
          node --check tools/data-tool/someip-audit.js
          node --check tools/data-tool/someip-generate.js
          node --check tools/data-tool/someip-generator.js
          node -e "JSON.parse(require('fs').readFileSync('mgu-repo.json'))"
          node -e "JSON.parse(require('fs').readFileSync('tools/data-tool/data-manifest.json'))"
          node -e "const s=JSON.parse(require('fs').readFileSync('apps/data-diagnostics/app.json')); if(s.mguInternet!==true)process.exit(1)"
      - name: Data Tool regression tests
        run: |
          node apps/data-diagnostics/upload.test.js
          node apps/data-diagnostics/network.test.js
          node apps/data-diagnostics/client.test.js
          node apps/data-diagnostics/cache-probe.test.js
          node apps/data-diagnostics/qr-report.test.js
          node apps/data-diagnostics/test-runner.test.js
          node apps/data-diagnostics/dpf-values.test.js
          node apps/data-diagnostics/vehicle-values.test.js
          node apps/data-diagnostics/translations.test.js
          node apps/data-diagnostics/results-view.test.js
          node tools/data-tool/test.js
          node tools/data-tool/dpf-compat.test.js
          node tools/data-tool/data-broker.test.js
          node tools/data-tool/broker-gateway.test.js
          node tools/data-tool/auth-feasibility.test.js
          node tools/data-tool/native-peer-feasibility.test.js
          node tools/data-tool/native-peer-runner.test.js
          node tools/data-tool/native-process-boundary.test.js
          node tools/data-tool/package-boundary.test.js
          node tools/data-tool/transport-trace.test.js
          node tools/data-tool/cc-front-contact.test.js
          node tools/data-tool/tasu21-recovery.test.js
          node tools/data-tool/health-startup.test.js
          node tools/data-tool/secure-ipc.test.js
          node tools/data-tool/identity-survey.test.js
          node apps/data-diagnostics/identity-survey.test.js
          node tools/data-tool/someip-setup.test.js
          node tools/data-tool/someip-audit.test.js
          node tools/data-tool/someip-generate.test.js
          node tools/data-tool/signal-environment.test.js
          node tools/data-tool/signal-isolate.test.js
          node tools/data-tool/diagnostic-report.test.js
          node tools/data-tool/cc-feasibility.test.js
          node apps/data-diagnostics/cc-test.test.js
          node tools/data-tool/gear-state.test.js
          node tools/data-tool/signal-manifest.test.js
          node tools/data-tool/signal-worker.test.js
          node tools/data-tool/uds-demand-scheduler.test.js
          node tools/data-tool/scheduler-live-test.test.js
          node tools/data-tool/scheduler-profile-test.test.js
          node tools/data-tool/scheduler-compare.test.js
          node tools/data-tool/public-api.test.js
          node tools/data-tool/ihka-public.test.js
          node tools/data-tool/public-cds.test.js
          node tools/data-tool/public-runtime.test.js
          node apps/data-diagnostics/api-probe.test.js
          node apps/data-diagnostics/endurance-probe.test.js
          node tools/data-tool/uds-demand-gateway.test.js
          node apps/dpf-dev/data-demand-plan.test.js
          node tools/data-tool/cds-engine.test.js
          node tools/data-tool/data-manifest.test.js
      - name: Linux-only native SO_PEERCRED proof (not packaged)
        run: |
          mkdir -p /tmp/bmrmodz-native-peer
          cc -std=c11 -Wall -Wextra -Werror -O2 -o /tmp/bmrmodz-native-peer/peercred tools/data-tool/native/peercred-probe.c
          node tools/data-tool/native/peercred-host.test.js /tmp/bmrmodz-native-peer/peercred
      - name: Verify embedded x86_64 libc-free executable corresponds to assembly source
        run: |
          cc -nostdlib -static -Wl,--build-id=none -Wl,-z,noexecstack -Wl,-z,relro -s -o /tmp/bmrmodz-native-peer/peercred-static tools/data-tool/native/peercred-static-x86_64.S
          node -e "const fs=require('fs'),crypto=require('crypto');const a=require('./tools/data-tool/native-peer-runner').unpack(),b=fs.readFileSync('/tmp/bmrmodz-native-peer/peercred-static');if(!a.equals(b))throw Error('Bundled ELF mismatches source')"
      - name: Build and behavior-test static x86_64 process boundary ELF
        run: |
          cc -Os -nostdlib -static -fno-stack-protector -fno-asynchronous-unwind-tables -Wl,--build-id=none -Wl,-z,noexecstack -s -o /tmp/bmrmodz-native-peer/process-boundary tools/data-tool/native/process-boundary-x86_64.c
          node tools/data-tool/native/process-boundary-source.test.js /tmp/bmrmodz-native-peer/process-boundary
      - name: Offline MGU preview build
        run: python3 kit/tools/build.py --preview-only data-diagnostics
