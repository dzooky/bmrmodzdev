name: Provider visibility experiment
on:
  pull_request:
  push:
    branches: [main]
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check apps/provider-visibility-test/main.js
      - run: python3 kit/tools/build.py --preview-only provider-visibility-test
      - run: python3 kit/tools/build.py --preview-only data-native-provider
      - run: |
          python3 - <<'PY'
          import json, pathlib
          for app, visibility in [('provider-visibility-test','BACKGROUND'),('data-native-provider','FOREGROUND')]:
              p = next(pathlib.Path('.').glob('**/'+app+'/source/package.json'))
              d = json.loads(p.read_text())
              assert d['oapAppSettings']['visibility'] == visibility
              assert d['mguAppStartType'] == 'autostart'
              assert json.loads(p.with_name('manifest.json').read_text())
          PY
