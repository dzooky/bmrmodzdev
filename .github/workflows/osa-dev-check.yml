name: OSA DEV isolated regression checks
on:
  pull_request:
    paths: ['apps/osa-dev/**', 'kit/tools/build.py', 'kit/localization/fonts/osa-cjk.json', '.github/workflows/osa-dev-check.yml']
  push:
    branches: [main]
    paths: ['apps/osa-dev/**', 'kit/tools/build.py', 'kit/localization/fonts/osa-cjk.json', '.github/workflows/osa-dev-check.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Baseline regression
        run: |
          node --check apps/osa-dev/main.js
          node --check apps/osa-dev/managed-data.js
          node apps/osa-dev/managed-data.test.js
          node apps/osa-dev/background-registration.test.js
          node apps/osa-dev/oil-notification.test.js
          node apps/osa-dev/test-oil-notification-delivery.js
          node -e "const a=require('./apps/osa-dev/app.json'),assert=require('assert'); assert.equal(a.id,'osa-dev'); assert.equal(a.loggingId,'OSAD'); assert.equal(a.requires['bmrmodz-data-tool'],'0.1.60');"
      - name: Build offline OSA DEV preview
        run: python3 kit/tools/build.py --preview-only osa-dev
