name: CC DEV isolated regression checks
on:
  pull_request:
    paths: ['apps/cc-dev/**', '.github/workflows/cc-dev-check.yml']
  push:
    branches: [main]
    paths: ['apps/cc-dev/**', '.github/workflows/cc-dev-check.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: CC DEV managed temperature checks
        run: |
          node --check apps/cc-dev/main.js
          node --check apps/cc-dev/managed-temperature.js
          node --check apps/cc-dev/public-client.js
          node apps/cc-dev/managed-temperature.test.js
          node apps/cc-dev/tab-navigation.test.js
          node -e "const a=require('./apps/cc-dev/app.json'),assert=require('assert');assert.equal(a.id,'cc-dev');assert.equal(a.requires['bmrmodz-data-tool'],'0.1.61')"
      - name: Offline CC DEV preview
        run: |
          python3 kit/tools/build.py --preview-only cc-dev
          python3 - <<'PY'
          import pathlib
          src = pathlib.Path('apps/cc-dev')
          for name in ('front-seat-quilted.png','front-seat.png','rear-seat-isofix.png','rear-seat-quilted.png','steering-m-sport.png','steering-standard.png'):
              data = (src/name).read_bytes()
              assert len(data)>100000 and data[:8] == b'\x89PNG\r\n\x1a\n', name
          print('CC DEV artwork restored and valid')
          PY
      - name: Reproduce MGU Store package build
        run: |
          mkdir -p dist/cc-dev-store
          MGU_OUT="$PWD/dist/cc-dev-store" python3 kit/tools/build.py cc-dev
          python3 - <<'PY'
          import json, pathlib, tarfile
          spec=json.loads(pathlib.Path('apps/cc-dev/app.json').read_text())
          archive=pathlib.Path('dist/cc-dev-store')/('cc-dev@'+spec['version']+'.tgz')
          assert archive.is_file(), 'Store archive missing'
          with tarfile.open(archive, 'r:gz') as pkg:
              files={member.name:member for member in pkg.getmembers()}
              assert 'package/package.json' in files
              for asset in spec['assets']:
                  name='package/javascript/'+asset['file']
                  assert name in files, name+' not packed'
                  obj=pkg.extractfile(files[name])
                  content=obj.read() if obj else b''
                  assert len(content)>100000 and content[:8]==bytes((137,80,78,71,13,10,26,10)), name+' invalid'
          print('CC DEV MGU Store archive includes valid artwork')
          PY
