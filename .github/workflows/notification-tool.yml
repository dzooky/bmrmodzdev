name: Notification Tool
on:
  push:
    paths:
      - 'tools/notification/**'
      - '.github/workflows/notification-tool.yml'
  pull_request:
    paths:
      - 'tools/notification/**'
      - '.github/workflows/notification-tool.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/notification/test.js
