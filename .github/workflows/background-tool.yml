name: Background Tool
on: [push, pull_request]
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '12'
      - run: node tools/background-tool/engine.test.js
      - run: node tools/background-tool/runtime.test.js
      - run: node tools/background-tool/service.test.js
