name: DPF DEV isolated regression checks
on:
  pull_request:
    paths: ['apps/dpf-dev/**', 'kit/tools/build.py', 'kit/localization/fonts/dpf-cjk.json', 'kit/localization/fonts/cyrillic-ru.json', '.github/workflows/dpf-dev-check.yml']
  push:
    branches: [main]
    paths: ['apps/dpf-dev/**', 'kit/tools/build.py', 'kit/localization/fonts/dpf-cjk.json', 'kit/localization/fonts/cyrillic-ru.json', '.github/workflows/dpf-dev-check.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Separate package identity and assets
        run: |
          node - <<'NODE'
          const assert=require('assert'),fs=require('fs');
          const app=require('./apps/dpf-dev/app.json');
          const source=fs.readFileSync('apps/dpf-dev/main.js','utf8');
          const build=fs.readFileSync('kit/tools/build.py','utf8');
          assert.strictEqual(app.id,'dpf-dev');
          assert.strictEqual(app.title,'DPF Status DEV');
          assert.strictEqual(app.version,'0.1.74');
          assert.strictEqual(app.loggingId,'DPFD');
          assert.strictEqual(app.settings.find(x=>x.key==='experimentalDataTool').default,false);
          assert.strictEqual(app.requires['bmrmodz-data-tool'],'0.1.38');
          assert(source.includes('const u = toolEnabled ? await dpfTransport.read(DDE, 0xF150)'));
          assert(source.includes('if (!toolEnabled) link.wake(DDE)'));
          assert(build.includes("app_id in ('dpf', 'dpf-dev')"));
          for(const filename of ['icon.png','brmodz_logo.png','qr_facebook.png','qr_instagram.png','qr_report_bug.png','qr_request_feature.png']) assert(fs.statSync('apps/dpf-dev/'+filename).size>0,filename);
          for(const name of ['dpf-cjk.json','cyrillic-ru.json']) assert(fs.statSync('kit/localization/fonts/'+name).size>0,name);
          console.log('DPF DEV identity/assets and unchanged legacy transport verified');
          NODE
      - name: DPF DEV behavioral checks
        run: |
          node --check apps/dpf-dev/main.js
          node --check apps/dpf-dev/translations.js
          node apps/dpf-dev/dde-profiles.test.js
          node apps/dpf-dev/distance-record.test.js
          node apps/dpf-dev/data-tool-read.test.js
          node apps/dpf-dev/diagnostics.test.js
          node apps/dpf-dev/regen-message.test.js
          node apps/dpf-dev/notification-preview.test.js
          node --test apps/dpf-dev/translations.test.js
